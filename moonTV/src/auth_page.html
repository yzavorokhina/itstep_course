<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonTV_Auth</title>
    <link rel="icon" type="image/svg+xml" href="./img/logo_moon_2.png">
    <link rel="stylesheet" href="./css/normilize.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/auth.css">
    <!-- <script defer src="./index.js"></script> -->
</head>
<body>
    <div class="container">
        <div class="form">
            <form action="#" id="registration_form">
                <img src="../src/img/logo_moon_1.png" alt="bootstrap-logo" class="auth_logo mx-auto" style="width: 60px;">
                <h1>Вход в VK Planets</h1>

                <div class="form-floating">
                    <input type="email" name="email" placeholder="Email или телефон" required />
                </div>

                <button type="submit" class="button-1">Продолжить</button>
                <button type="submit" class="button-2">Создать аккаунт с VK ID</button>

                <div class="form-check">
                    <input type="button" name="Rememberme" value="Забыли пароль?" checked /><br>
                </div>

                 <p class="copy">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash; Войти через &mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</p>
                <button type="submit" class="button-3">Войти через VK ID</button>
            </form>
        </div>
    </div>
    <script src="./js/bootstrap.min.js"></script>
</body>
</html>
